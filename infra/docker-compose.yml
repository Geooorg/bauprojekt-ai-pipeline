services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: bauprojekt-postgres
    environment:
      POSTGRES_DB: bauprojekt
      POSTGRES_USER: bauprojekt
      POSTGRES_PASSWORD: bauprojekt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bauprojekt"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: bauprojekt-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: bauprojekt
      RABBITMQ_DEFAULT_PASS: bauprojekt
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio
    container_name: bauprojekt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bauprojekt
      MINIO_ROOT_PASSWORD: change-me-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data: