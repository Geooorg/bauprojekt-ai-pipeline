[project]
name = "bauprojekt-ai-pipeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bauprojekt"
