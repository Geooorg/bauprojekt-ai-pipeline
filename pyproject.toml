[project]
name = "bauprojekt-ai-pipeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
